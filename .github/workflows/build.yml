name: SonarCloud

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  tests:
    name: CPU tests, style, and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.2,<3'
          python -m pip install -r requirements.txt -r requirements-training.txt 'pytest-cov>=6,<8' 'ruff==0.12.0'
          if test -f requirements-serving.txt; then
            python -m pip install -r requirements-serving.txt
          fi
      - name: Check Python syntax and style
        run: |
          python -m compileall -q etl_scripts/src tests
          ruff check etl_scripts/src tests --exclude '*.ipynb'
          if test -d scripts; then
            python -m compileall -q scripts
            ruff check scripts
          fi
      - name: Run tests with coverage
        run: python -m pytest -q tests --cov=etl_scripts.src --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error

  sonarqube:
    name: SonarQube Cloud analysis
    needs: tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
