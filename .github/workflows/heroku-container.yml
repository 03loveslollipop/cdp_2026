name: Build and deploy Heroku container

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdp-2026-heroku-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-serving.txt
            requirements-release.txt
            etl_scripts/src/deployment_model_config.json

      - name: Install deployment-training dependencies
        run: |
          python -m pip install -r requirements-serving.txt
          python scripts/install_model_runtime.py etl_scripts/src/deployment_model_config.json

      - name: Train configured winning model
        run: python -m etl_scripts.src.model_deploy train --output-dir deployment_artifacts

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Build and push process images
        run: |
          heroku container:login
          docker buildx build --platform linux/amd64 --provenance=false \
            --output "type=registry,name=registry.heroku.com/${HEROKU_APP_NAME}/web,oci-mediatypes=false" \
            --file Dockerfile.web .
          docker buildx build --platform linux/amd64 --provenance=false \
            --output "type=registry,name=registry.heroku.com/${HEROKU_APP_NAME}/release,oci-mediatypes=false" \
            --file Dockerfile.release .

      - name: Release and verify
        run: |
          heroku container:release web release --app "$HEROKU_APP_NAME"
          APP_URL="$(heroku apps:info --app "$HEROKU_APP_NAME" --json | python -c 'import json,sys; print(json.load(sys.stdin)["app"]["web_url"])')"
          curl --fail --retry 8 --retry-delay 10 "${APP_URL}health/ready"
