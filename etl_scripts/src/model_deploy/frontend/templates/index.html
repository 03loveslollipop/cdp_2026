<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CDP 2026 batch predictions</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main>
  <nav>
    <h1>Credit batch predictions</h1>
    <div><a href="/inference/">Single inference</a><a id="monitor-link" href="{{ monitor_ui_url }}" hidden>Monitoring</a></div>
  </nav>
  <section id="login-section">
    <h2>Sign in</h2>
    <form id="login-form" class="login-grid">
      <label>Username<input id="username" autocomplete="username" required></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Get 2-hour token</button>
    </form>
    <p id="login-status" role="status" class="muted">Inference and owner accounts can run predictions.</p>
  </section>
  <section id="app-section" hidden>
    <div class="toolbar">
      <p id="session-status" class="muted"></p>
      <button id="logout" type="button" class="secondary">Sign out</button>
    </div>
    <p>Upload a CSV containing exactly the active model predictor columns. Missing values are preserved for the fitted preparation pipeline.</p>
    <form id="upload-form">
      <input id="file" name="file" type="file" accept=".csv,text/csv" required>
      <button id="submit" type="submit" disabled>Predict batch</button>
    </form>
    <p id="status" role="status"></p>
    <pre id="preview" hidden></pre>
    <a id="download" hidden download="predictions.csv">Download predictions</a>
    <div style="overflow:auto"><table id="results" hidden><thead></thead><tbody></tbody></table></div>
  </section>
</main>
<script src="/static/auth.js"></script>
<script>
  const loginSection = document.getElementById('login-section');
  const appSection = document.getElementById('app-section');
  const loginForm = document.getElementById('login-form');
  const loginStatus = document.getElementById('login-status');
  const sessionStatus = document.getElementById('session-status');
  const monitorLink = document.getElementById('monitor-link');
  const monitorUrl = {{ monitor_ui_url | tojson }};
  const form = document.getElementById('upload-form');
  const status = document.getElementById('status');
  const table = document.getElementById('results');
  const download = document.getElementById('download');
  const fileInput = document.getElementById('file');
  const submit = document.getElementById('submit');
  const preview = document.getElementById('preview');
  let expectedColumns = [];

  const showLogin = message => {
    CDPAuth.clear(); loginSection.hidden = false; appSection.hidden = true; monitorLink.hidden = true;
    if (message) { loginStatus.textContent = message; loginStatus.className = 'error'; }
  };
  const activate = async session => {
    loginSection.hidden = true; appSection.hidden = false;
    monitorLink.hidden = session.role !== 'owner' || !monitorUrl;
    sessionStatus.textContent = `Signed in as ${session.username} (${session.role}); token expires at ${new Date(session.expiresAt * 1000).toLocaleTimeString()}.`;
    await loadContract();
  };
  loginForm.addEventListener('submit', async event => {
    event.preventDefault(); loginStatus.textContent = 'Signing in…'; loginStatus.className = 'muted';
    try {
      await activate(await CDPAuth.login(
        document.getElementById('username').value,
        document.getElementById('password').value
      ));
      loginForm.reset();
    } catch (error) { loginStatus.textContent = error.message; loginStatus.className = 'error'; }
  });
  document.getElementById('logout').addEventListener('click', async () => {
    await CDPAuth.logout(); showLogin('Signed out.');
  });

  const firstCsvRecord = text => {
    let quoted = false;
    for (let index = 0; index < text.length; index += 1) {
      if (text[index] === '"') {
        if (quoted && text[index + 1] === '"') index += 1;
        else quoted = !quoted;
      } else if (!quoted && (text[index] === '\n' || text[index] === '\r')) return text.slice(0, index);
    }
    return text;
  };
  const parseCsvRecord = record => {
    const fields = []; let value = ''; let quoted = false;
    for (let index = 0; index < record.length; index += 1) {
      const character = record[index];
      if (character === '"') {
        if (quoted && record[index + 1] === '"') { value += '"'; index += 1; }
        else quoted = !quoted;
      } else if (character === ',' && !quoted) { fields.push(value); value = ''; }
      else value += character;
    }
    fields.push(value);
    return fields.map((field, index) => index === 0 ? field.replace(/^\uFEFF/, '') : field);
  };
  const loadContract = async () => {
    const response = await CDPAuth.request('/v1/model');
    if (!response.ok) throw new Error('Unable to load the active model contract');
    expectedColumns = (await response.json()).required_predictors;
  };

  fileInput.addEventListener('change', async () => {
    submit.disabled = true; preview.hidden = true; status.className = '';
    const file = fileInput.files[0];
    if (!file) { status.textContent = ''; return; }
    try {
      if (!expectedColumns.length) await loadContract();
      const sample = await file.slice(0, 65536).text();
      const headers = parseCsvRecord(firstCsvRecord(sample));
      const duplicates = headers.filter((name, index) => headers.indexOf(name) !== index);
      const allowed = new Set([...expectedColumns, '_external_reference']);
      const missing = expectedColumns.filter(name => !headers.includes(name));
      const extra = headers.filter(name => !allowed.has(name));
      preview.textContent = sample.split(/\r?\n/).slice(0, 4).join('\n'); preview.hidden = false;
      if (duplicates.length || missing.length || extra.length) {
        throw new Error(`Header mismatch. Missing: ${missing.join(', ') || 'none'}; extra: ${extra.join(', ') || 'none'}; duplicates: ${duplicates.join(', ') || 'none'}.`);
      }
      submit.disabled = false;
      status.textContent = `Schema preview valid: ${headers.length} columns; ${file.size.toLocaleString()} bytes.`;
    } catch (error) { status.textContent = error.message; status.className = 'error'; }
  });

  form.addEventListener('submit', async event => {
    event.preventDefault(); status.textContent = 'Running predictions…'; status.className = '';
    table.hidden = true; download.hidden = true;
    const body = new FormData(); body.append('file', fileInput.files[0]);
    try {
      const response = await CDPAuth.request('/v1/predictions/csv', {
        method: 'POST', body, headers: {'Idempotency-Key': crypto.randomUUID()}
      });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.detail || 'Prediction failed');
      const columns = ['event_id', 'row_number', 'external_reference', 'predicted_label', 'default_probability', 'on_time_probability'];
      table.querySelector('thead').replaceChildren(); table.querySelector('tbody').replaceChildren();
      const heading = document.createElement('tr');
      columns.forEach(name => { const th = document.createElement('th'); th.textContent = name; heading.appendChild(th); });
      table.querySelector('thead').appendChild(heading);
      payload.items.forEach(item => {
        const row = document.createElement('tr');
        columns.forEach(name => { const td = document.createElement('td'); td.textContent = item[name] ?? ''; row.appendChild(td); });
        table.querySelector('tbody').appendChild(row);
      });
      const quote = value => `"${String(value ?? '').replaceAll('"', '""')}"`;
      const csv = [columns.join(','), ...payload.items.map(item => columns.map(name => quote(item[name])).join(','))].join('\n');
      download.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
      download.hidden = false; table.hidden = false;
      status.textContent = `${payload.items.length} predictions completed with ${payload.model_family}.`;
    } catch (error) {
      status.textContent = error.message; status.className = 'error';
      if (!CDPAuth.current()) showLogin('Your session expired. Sign in again.');
    }
  });

  const existingSession = CDPAuth.current();
  if (existingSession) activate(existingSession).catch(error => showLogin(error.message));
</script>
</body>
</html>
